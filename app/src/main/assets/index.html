.av-principal{background:var(--gloss),radial-gradient(circle at 50% 22%,#ff8a80,#e53935 36%,#a31515 72%,#5c0707)!important;box-shadow:var(--bev),0 0 0 2px #ff5a5a,0 4px 0 #4d0505,0 7px 14px rgba(0,0,0,.4),0 0 18px rgba(255,70,70,.55)!important}

/* ===== التصميم الخفيف (فاتح، مسطّح، دون مؤثرات ثقيلة) — يُفعَّل لكل جهاز من زر ☀️ أو رابط ‎#control-lite‎ ===== */
html.lite{
  --bg:#f3f5f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#f6f8fc;
  --line:#e4e9f1; --line2:#d5dde9;
  --fg:#18233a; --muted:#64708a; --accent:#0b6fb8;
  --ok:#14955f; --act:#2c5fe0; --wait:#b97f00; --urg:#d1323f;
  color-scheme:light;
}
html.lite,html.lite body{background:var(--bg);color:var(--fg)}
html.lite .sky,html.lite .floor{display:none}

<script>/* Offline runtime: replaces the claude.ai runtime with on-device storage */
(function(){
  var KEY='ss-offline-db-v1';
  var store=null;
  try{store=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!store||typeof store!=='object'){store=JSON.parse(JSON.stringify(window.__SEED__||{}));persist()}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){console.log('save failed',e)}}
  var subs=[];
  function clone(o){return o==null?o:JSON.parse(JSON.stringify(o))}
  function colDocs(col){var pre=col+'/',out=[];for(var k in store){if(k.indexOf(pre)===0&&k.slice(pre.length).indexOf('/')<0){(function(id,k){out.push({id:id,exists:true,data:function(){return clone(store[k])}})})(k.slice(pre.length),k)}}return out}
  function colSnap(col){return{docs:colDocs(col),size:colDocs(col).length,empty:!colDocs(col).length,metadata:{fromCache:false,hasPendingWrites:false}}}
  function docSnap(path){var ex=Object.prototype.hasOwnProperty.call(store,path);var id=path.split('/').pop();return{id:id,exists:ex,data:function(){return ex?clone(store[path]):undefined},metadata:{fromCache:false,hasPendingWrites:false}}}
  function notify(path){var col=path.split('/').slice(0,-1).join('/');subs.slice().forEach(function(s){try{if(s.t==='doc'&&s.p===path)s.cb(docSnap(path));else if(s.t==='col'&&s.p===col)s.cb(colSnap(col))}catch(e){console.log(e)}})}
  function deepMerge(a,b){for(var k in b){var v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],v);else a[k]=clone(v)}return a}
  function docRef(path){return{
    id:path.split('/').pop(),path:path,
    set:function(d,opt){store[path]=(opt&&opt.merge&&store[path])?deepMerge(store[path],d):clone(d);persist();setTimeout(function(){notify(path)},0);return Promise.resolve()},
    update:function(p){var o=store[path]||{};for(var k in p){if(k.indexOf('.')>0){var parts=k.split('.'),cur=o;for(var i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]&&typeof cur[parts[i]]==='object'?cur[parts[i]]:{};cur=cur[parts[i]]}cur[parts[parts.length-1]]=clone(p[k])}else o[k]=clone(p[k])}store[path]=o;persist();setTimeout(function(){notify(path)},0);return Promise.resolve()},
    delete:function(){delete store[path];persist();setTimeout(function(){notify(path)},0);return Promise.resolve()},
    get:function(){return Promise.resolve(docSnap(path))},

    collection:function(c){return colRef(path+'/'+c)}
  }}
  function colRef(col){return{
    doc:function(id){return docRef(col+'/'+(id||Date.now().toString(36)+Math.random().toString(36).slice(2,8)))},
    add:function(d){var r=this.doc();return r.set(d).then(function(){return r})},
    get:function(){return Promise.resolve(colSnap(col))},
    onSnapshot:function(cb){var s={t:'col',p:col,cb:cb};subs.push(s);setTimeout(function(){cb(colSnap(col))},0);return function(){subs=subs.filter(function(x){return x!==s})}}
  }}
  var db={collection:colRef,doc:docRef};
  var user={isOwner:function(){return Promise.resolve(true)},id:function(){return Promise.resolve('device')}};
  var downloads={save:function(o){
    var name=(o&&o.filename)||'file.txt',data=(o&&o.data)||'';
    if(window.AndroidSave&&window.AndroidSave.save){var ok=window.AndroidSave.save(name,typeof data==='string'?data:String(data));return ok?Promise.resolve():Promise.reject({code:'failed'})}
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+data],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
  window.claude={use:function(n){if(n==='db')return Promise.resolve(db);if(n==='user')return Promise.resolve(user);if(n==='downloads')return Promise.resolve(downloads);return Promise.reject(new Error('unavailable offline'))}};

  window.__ssExport=function(){return JSON.stringify(store)};
  window.__ssImport=function(txt){try{var o=JSON.parse(txt);if(!o||typeof o!=='object')return false;store=o;persist();location.reload();return true}catch(e){return false}};

/* first-run import button: shown only while no staff are stored */
(function(){
  function hasData(){try{var s=JSON.parse(localStorage.getItem('ss-offline-db-v1')||'{}');for(var k in s){if(k.indexOf('staff/')===0)return true}}catch(e){}return false}
  function add(){

    inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){if(!window.__ssImport(String(r.result)))alert('الملف غير صالح')};r.readAsText(f)};
    var b=document.createElement('button');b.id='ssImp';b.textContent='📥 استيراد بيانات المدرسة';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:99999;padding:14px 22px;border-radius:14px;border:0;background:#22d68a;color:#04210f;font:700 16px Tahoma,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.4)';
    b.onclick=function(){inp.click()};document.body.appendChild(inp);document.body.appendChild(b)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();

async function dedupeRecurring(){

  for(const t of open.sort((a,b)=>(a.sendAt||a.createdAt||0)-(b.sendAt||b.createdAt||0))){const k=t.recId+'|'+t.staffId;

}
async function genRecurring(){
  if(genBusy||!S.owner||!S.ready)return;genBusy=true;
  try{const now=Date.now();
    for(const rc of S.recs||[]){
      if(!rc.active||!rc.repeat)continue;
      const occ=lastOcc(rc.repeat,now);if(occ==null)continue;
      if(occ<=(rc.lastRun||0)||occ<(rc.createdAt||0)-60000)continue;
      if(now-occ>36*3600e3){await putRec(rc.id,{...rc,lastRun:occ});continue} // skip stale catch-up
      const ids=(rc.staffIds||[]).filter(x=>staffById(x));const gid=ids.length>1?`rg${rc.id}${occ}`:null;
      for(const sid of ids){const tid=`r${rc.id}${occ}${sid}`.replace(/[^A-Za-z0-9]/g,'');
        if(S.rawTasks.some(t=>t.id===tid))continue;
        /* one task at a time: while the colleague's previous copy of this recurring task is not completed,
           no new copy is created — the open one keeps its numbered daily reminder until it is done */
        if(S.tasks.some(t=>t.recId===rc.id&&t.staffId===sid&&['pending','sent','received','inprogress'].includes(t.status)))continue;
        const o={title:rc.title,staffId:sid,priority:rc.priority||'med',status:'pending',createdAt:now,sendAt:occ,startAt:occ,due:rc.durMs?occ+rc.durMs:null,
          templateId:rc.templateId||'assign',message:rc.message||'',progress:0,sentAt:null,repliedAt:null,remind:rc.remind||{freq:'auto'},recId:rc.id};
        if(gid)o.groupId=gid;await put('tasks',tid,o)}

    }

  }finally{genBusy=false}
}

const KSA=3*3600e3;
const dayStartOf=t=>Math.floor((t+KSA)/864e5)*864e5-KSA;
const WORKDAYS=()=>{const d=(S.scr&&S.scr.hours&&S.scr.hours.days&&S.scr.hours.days.length)?S.scr.hours.days:[0,1,2,3,4];return d.map(Number)};
const isWork=d0=>WORKDAYS().includes(new Date(d0+KSA+12*3600e3).getUTCDay());
function workDayOnOrBefore(d0){for(let i=0;i<8&&!isWork(d0);i++)d0-=864e5;return d0}
function workDayAfter(d0){let x=d0+864e5;for(let i=0;i<8&&!isWork(x);i++)x+=864e5;return x}
function lastWorkDayOfWeek(ws){const w=WORKDAYS();const mx=Math.max(...w.filter(x=>x<=6));return ws+(mx+1)*864e5}
function inDay(t,d0){const d1=d0+864e5;if(!isWork(d0))return false;const w=x=>x&&x>=d0&&x<d1;return w(t.sendAt)||w(t.due)||w(t.sentAt)||w(t.repliedAt)||w(t.doneAt)}
function periodStart(){
  const now=Date.now();
  if(S.period==='day')return S.day||workDayOnOrBefore(dayStartOf(now));
  if(S.period==='week')return now-7*864e5;
  if(S.period==='month')return now-30*864e5;
  return S.settings.termStart||now-120*864e5;
}
function staffMetrics(s,from,mode){
  const day=(mode||S.period)==='day'&&from;
  const ts=S.tasks.filter(t=>t.staffId===s.id&&(day?inDay(t,from):(from?inRange(t,from,Infinity):true)));
  const sent=ts.filter(t=>t.sentAt);const rep=sent.filter(replied);
  const done=ts.filter(t=>t.status==='done');
  const rt=rep.filter(t=>t.repliedAt&&t.sentAt).map(t=>(t.repliedAt-t.sentAt)/60000);
  const pv=PLATFORMS.map(p=>s.platforms&&typeof s.platforms[p.k]==='number'?s.platforms[p.k]:null);
  const pvals=pv.filter(v=>v!=null);
  const pAvg=pvals.length?pvals.reduce((a,b)=>a+b,0)/pvals.length:null;
  const completion=ts.length?ts.reduce((a,t)=>a+progressOf(t),0)/ts.length:null;
  const interaction=sent.length?rep.length/sent.length*100:null;
  const L=lateStats(ts);const taskPart=completion==null?null:L.onTime==null?completion:(completion+L.onTime)/2;
  const parts=[[taskPart,.35],[interaction,.15],[pAvg,.5]].filter(x=>x[0]!=null);
  const w=parts.reduce((a,x)=>a+x[1],0);
  const score=w?parts.reduce((a,x)=>a+x[0]*x[1],0)/w:null;
  const rems=S.tasks.filter(t=>t.staffId===s.id).reduce((q,t)=>q+(day?remIn(t,from,from+864e5):remIn(t,from||0,Infinity)),0);
  return {...L,rems,ts,sent,rep,done,completion,interaction,avgReply:rt.length?rt.reduce((a,b)=>a+b,0)/rt.length:null,pv,pAvg,score,declined:ts.filter(t=>t.status==='declined').length};
}
function totals(){
  const T=S.tasks;const n=T.length||0;
  const c=st=>T.filter(t=>st.includes(t.status)).length;
  const sent=T.filter(t=>t.sentAt);const rep=sent.filter(replied);
  const assignees=new Set(T.filter(t=>t.status!=='done').map(t=>t.staffId));
  return {n,done:c(['done']),active:c(['received','inprogress','sent']),wait:c(['pending']),declined:c(['declined']),
    interaction:sent.length?rep.length/sent.length*100:0,assignees:assignees.size,completion:n?c(['done'])/n*100:0,
    due:T.filter(t=>t.status==='pending'&&t.sendAt&&t.sendAt<=Date.now()).concat(T.filter(t=>remindDue(t)))};
}

function ring(v){
  const r=120,c=2*Math.PI*r,T=totals(),n=T.n||1;
  const seg=[[T.done,'var(--ok)'],[T.active,'var(--act)'],[T.wait,'var(--wait)'],[T.declined,'var(--urg)']];
  let off=0;const arcs=seg.map(([x,col])=>{const len=x/n*c;const a=`<circle cx="150" cy="150" r="${r}" fill="none" stroke="${col}" stroke-width="26" stroke-dasharray="${Math.max(0,len-3)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 150 150)"/>`;off+=len;return a}).join('');
  return `<svg viewBox="0 0 300 300" role="img" aria-label="توزيع المهام"><circle cx="150" cy="150" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="26"/>${arcs}</svg>`;
}

}

function fitScreen(){
  const fit=$('#sfit'),inn=$('#sfitIn');if(!fit||!inn)return;
  const ah=($('#scrAnn')||{}).offsetHeight||0;
  const W=innerWidth,H=innerHeight-ah,portrait=innerHeight>W*1.1,ratio=H/W;
  inn.classList.toggle('portrait',portrait);
  inn.style.transform='none';inn.style.height='auto';inn.style.minHeight='0';
  // widen the design canvas until the content fits the screen's own aspect ratio,
  // then scale by width: the canvas fills the whole screen with no side margins
  let BW=portrait?720:1280;
  for(let i=0;i<14;i++){inn.style.width=BW+'px';if(inn.scrollHeight<=BW*ratio+1)break;BW=Math.round(BW*1.08)}
  const BH=Math.round(BW*ratio);
  inn.style.height=BH+'px';
  const sc=W/BW;
  inn.style.transform=`scale(${sc.toFixed(5)})`;
  const r=$('#sres');if(r)r.textContent=`${Math.round(W*devicePixelRatio)}×${Math.round(H*devicePixelRatio)} · ${portrait?'عمودي':'أفقي'} · ${location.origin}`;
}

    if(base.due&&base.startAt&&base.due<=base.startAt){toast('نهاية مدة الإنجاز يجب أن تكون بعد بدايتها');return}

      for(const sid of ids){const o={...base,...fresh(),staffId:sid};if(gid)o.groupId=gid;await put('tasks',uid(),o)}

    // edit
    const extra=pickerVals().filter(x=>x!==$('#tStaff').value);const editStaff=$('#tStaff').value;
    let gid=t.groupId||(extra.length?uid():null);
    const o={...t,...base,staffId:editStaff};if(gid)o.groupId=gid;

    for(const sid of extra){if(S.tasks.some(x=>x.groupId===gid&&x.staffId===sid))continue;await put('tasks',uid(),{...base,...fresh(),staffId:sid,groupId:gid})}
    toast(extra.length?`تم الحفظ وأُضيف ${extra.length} زميل للمهمة`:'تم حفظ المهمة');
  };
}

function importForm(k){
  const p=PLATFORMS.find(x=>x.k===k);
  openModal(`<div class="ph"><h3>استيراد بيانات ${p.n}</h3><button class="btn sm ghost" data-act="close">إغلاق</button></div>
  <p class="muted" style="margin-top:0">صدّر تقرير "${p.m}" من ${p.n}، ثم الصق عمودي الاسم (أو الجوال) والنسبة هنا، سطر لكل زميل.</p>
  <form id="fImp" style="display:flex;flex-direction:column;gap:12px"><textarea class="in" id="imp" placeholder="أ. أحمد محمد, 92&#10;0500000002, 85"></textarea><div class="toolbar" style="justify-content:flex-end"><button class="btn pri">استيراد</button></div></form>`);
  $('#fImp').onsubmit=async e=>{e.preventDefault();
    const lines=$('#imp').value.split(/\n/).map(l=>l.split(/\t|,|،/).map(x=>x.trim())).filter(c=>c[0]&&c[1]!=null);
    let ok=0,miss=[],amb=[],bad=[];const done=new Set();
    for(const cells of lines){
      const key=cells[0];
      // value = last numeric cell on the line (exports often have extra columns)
      let v=NaN;for(let i=cells.length-1;i>=1;i--){const n=parseFloat(toLatin(cells[i]).replace('%','').replace('٫','.'));if(!isNaN(n)){v=n<=1&&String(cells[i]).includes('.')&&!String(cells[i]).includes('%')?n*100:n;break}}
      if(isNaN(v)){bad.push(key);continue}
      const dk=toLatin(key).replace(/\D/g,'');const nk=normAr(key);
      let cand=dk.length>=8?S.staff.filter(s=>intlPhone(s.phone)===intlPhone(dk)):[];
      if(!cand.length)cand=S.staff.filter(s=>normAr(s.name)===nk);
      if(!cand.length&&nk.length>3)cand=S.staff.filter(s=>normAr(s.name).includes(nk)||nk.includes(normAr(s.name)));
      if(!cand.length){miss.push(key);continue}
      if(cand.length>1){amb.push(key+' ← '+cand.map(c=>c.name).join(' / '));continue}
      const s=cand[0];if(done.has(s.id))continue;done.add(s.id);
      await patch('staff',s.id,{platforms:{[k]:Math.max(0,Math.min(100,v))}});ok++;
    }
    const issues=[...miss.map(x=>['لم يُعثر عليه',x]),...amb.map(x=>['أكثر من زميل مطابق',x]),...bad.map(x=>['لا توجد نسبة',x])];
    if(!issues.length){closeModal();toast(`تم تحديث ${ok} زميل في ${p.n}`);return}
    openModal(`<div class="ph"><h3>نتيجة الاستيراد · ${esc(p.n)}</h3><button class="btn sm ghost" data-act="close">إغلاق</button></div>
      <div class="rok" style="margin-bottom:12px"><b>تم تحديث ${ok} زميل</b><span>الأسطر التالية تحتاج مراجعة، صحّح الاسم أو اكتب رقم الجوال بدلاً منه ثم أعد استيرادها.</span></div>
      <div class="ass">${issues.map(([t,x])=>`<div class="arow" style="grid-template-columns:auto minmax(0,1fr)">${chip({t,c:'var(--wait)'})}<span>${esc(x)}</span></div>`).join('')}</div>`);
  };
}

  else if(a==='arch-del'){if(el.dataset.confirm){if(S.live){try{await db.collection('archive').doc(id).delete()}catch(e){fail(e)}}else S.arch=S.arch.filter(x=>x.id!==id);S.archOpen=null;render();toast('حُذف التقرير من الأرشيف')}else{el.dataset.confirm='1';el.textContent='تأكيد الحذف'}}
  else if(a==='arch-run'){await autoArchive();render();toast('حُفظت التقارير المستحقة')}
  else if(a==='arch-save-now'){const c=currentSnapForReport();const ok=await putArch(c.id,buildSnap(c.kind,c.a,c.b,c.title,c.range));if(ok){S.archFolder=c.kind;toast('حُفظ التقرير في الأرشيف · '+({day:'اليومية',week:'الأسبوعية',month:'الشهرية'}[c.kind]))}}
  else if(a==='theme'){const lite=!document.documentElement.classList.contains('lite');document.documentElement.classList.toggle('lite',lite);try{localStorage.setItem('ss-theme',lite?'lite':'3d')}catch(e){}paintTheme();render();toast(lite?'التصميم الخفيف ☀️':'التصميم ثلاثي الأبعاد 🌙')}
  else if(a==='settings'){S.view='settings';render();scrollTo({top:0})}
  else if(a==='logo-del'){S.settings.logo=null;renderLogo();await saveSettings();render();toast('حُذف الشعار')}
  else if(a==='set-save'){const st=S.settings;const dig=x=>toLatin(x).replace(/\D/g,'');
    const sp=dig($('#stSender').value),ap=dig($('#stAdmin').value);
    if(sp&&!/^(05\d{8}|01\d{8}|9665\d{8}|9661\d{8}|800\d{7}|9200\d{5})$/.test(sp)){toast('رقم المرسل غير صحيح');return}
    if(ap&&!phoneOk(ap)){toast('رقم الإدارة يجب أن يكون 10 أرقام يبدأ بـ 05');return}
    const rd=[...document.querySelectorAll('.stRemD:checked')].map(x=>+x.value),hd=[...document.querySelectorAll('.stHD:checked')].map(x=>+x.value);
    if($('#stRemOn').checked&&!rd.length){toast('اختر يوماً واحداً على الأقل للتذكير');return}
    st.schoolName=$('#stSchool').value.trim()||null;st.principal=$('#stPrincipal').value.trim()||null;st.city=$('#stCity').value.trim()||null;
    st.senderPhone=sp;st.schoolPhone=ap;
    const tv=$('#stTerm').value;st.termStart=tv?Date.parse(tv+'T00:00:00Z')-KSA:null;
    const prev=remGlobal();const on=$('#stRemOn').checked;st.remGlobal={on,days:rd.length?rd:prev.days,time:$('#stRemT').value||'07:45',since:(prev.on&&on)?prev.since:Date.now()};
    const links={...(st.links||{})};document.querySelectorAll('.stLink').forEach(i=>{let u=i.value.trim();const p=PLATFORMS.find(x=>x.k===i.dataset.k);if(u&&!/^https?:\/\//i.test(u))u='https://'+u;if(!u||u===(p&&p.url))delete links[i.dataset.k];else links[i.dataset.k]=u});st.links=links;
    await saveSettings();
    await saveScreen({hours:{on:$('#stHoursOn').checked,days:hd,start:$('#stHS').value||'06:15',end:$('#stHE').value||'13:30'},full:$('#stFull').value==='1',achPer:$('#stAch').value});
    render();toast('تم حفظ كل الإعدادات')}
  else if(a==='rg-save'){const ds=[...document.querySelectorAll('.rgD:checked')].map(x=>+x.value);if(!ds.length){toast('اختر يوماً واحداً على الأقل');return}
    const prev=remGlobal();S.settings.remGlobal={on:$('#rgOn').checked,days:ds,time:$('#rgT').value||'07:45',since:(prev.on&&$('#rgOn').checked)?prev.since:Date.now()};await saveSettings();render();toast('تم حفظ التذكير التلقائي العام')}
  else if(a==='bot-save'){S.settings.bot={on:$('#botOn').checked,unknown:$('#botUnk').checked};await saveSettings();render();toast('تم حفظ إعداد الواتس الذكي')}
  else if(a==='bot-try'){const ph=$('#botWho').value,tx=$('#botTx').value.trim();const o=$('#botOut');if(!ph||!tx){toast('اختر زميلاً واكتب رداً');return}const r=await botReply(ph,tx,{dry:true});o.hidden=false;o.textContent=r||'(لن يُرسل رد: الردود التلقائية متوقفة)'}
  else if(a==='snd-save'){const v=toLatin($('#sndPhone').value).replace(/\D/g,'');if(!/^(05\d{8}|01\d{8}|9665\d{8}|9661\d{8}|800\d{7}|9200\d{5})$/.test(v)){toast('اكتب رقم جوال (05xxxxxxxx) أو هاتف ثابت (01xxxxxxxx) أو رقماً موحداً');return}S.settings.senderPhone=v;if(!S.settings.schoolPhone)S.settings.schoolPhone=v;await saveSettings();render();toast('تم حفظ رقم المرسل واعتماده')}
  else if(a==='snd-toggle'){S.sender=!S.sender;try{S.sender?localStorage.setItem('ss-sender','1'):localStorage.removeItem('ss-sender')}catch(e){}if(S.sender)heartbeat(0);render();toast(S.sender?'هذا الجهاز الآن مرسل تلقائي':'أُوقف الإرسال من هذا الجهاز')}
  else if(a==='queue')queueForm();
  else if(a==='q-send'){const t=S.tasks.find(x=>x.id===id);if(t&&!t.sentAt){await patch('tasks',id,{status:'sent',sentAt:Date.now()})}setTimeout(queueForm,400)}
  else if(a==='q-rsend'){await markReminded(id);setTimeout(queueForm,300)}
  else if(a==='q-rskip'){await patch('tasks',id,{lastRemindAt:Date.now()});setTimeout(queueForm,300)}
  else if(a==='rem-send'){await markReminded(id);toast('سُجّل إرسال التذكير')}
  else if(a==='rem-skip'){await patch('tasks',id,{lastRemindAt:Date.now()});toast('تم تخطي التذكير')}
  else if(a==='q-skip'){await patch('tasks',id,{sendAt:Date.now()+30*60000});setTimeout(queueForm,200)}
  else if(a==='sound'){S.sound=!S.sound;try{localStorage.setItem('ss-sound',S.sound?'1':'')}catch(e){}if(S.sound)beep();render()}
  else if(a==='pin-menu')pinForm('menu');
  else if(a==='pin-unlock')pinForm('unlock');
  else if(a==='pin-submit'){}
  else if(a==='pin-lock')lockNow();
  else if(a==='pin-change')pinForm('change');
  else if(a==='pin-remove')pinForm('remove');
  else if(a==='logo')$('#logoFile').click();
  else if(a==='edit-link')linkForm(el.dataset.k);
  else if(a==='reset-link'){const l={...(S.settings.links||{})};delete l[el.dataset.k];S.settings.links=l;closeModal();await saveSettings();render();toast('أُعيد الرابط الافتراضي')}
  else if(a==='new-staff')staffForm();
  else if(a==='edit-staff')staffForm(staffById(id));
  else if(a==='bulk-staff')bulkStaff();
  else if(a==='del-staff'){if(el.dataset.confirm){closeModal();await del('staff',id);toast('تم حذف الزميل')}else{el.dataset.confirm='1';el.textContent='اضغط مرة أخرى للتأكيد'}}
  else if(a==='new-task')taskForm(null,id);
  else if(a==='edit-task')taskForm(S.tasks.find(t=>t.id===id));
  else if(a==='del-group'){if(el.dataset.confirm){const g=S.tasks.filter(t=>t.groupId===id);closeModal();for(const t of g)await del('tasks',t.id);toast(`حُذفت المهمة من ${g.length} زملاء`)}else{el.dataset.confirm='1';el.textContent='تأكيد حذف الجميع'}}
  else if(a==='del-task'){if(el.dataset.confirm){closeModal();await del('tasks',id);toast('تم حذف المهمة')}else{el.dataset.confirm='1';el.textContent='تأكيد الحذف'}}
  else if(a==='send'){const t=S.tasks.find(t=>t.id===id);if(t&&!t.sentAt){await patch('tasks',id,{status:'sent',sentAt:Date.now()});toast('سُجّل وقت الإرسال')}}
  else if(a==='reply')replyForm(S.tasks.find(t=>t.id===id));
  else if(a==='report')staffReport(id);
  else if(a==='import')importForm(el.dataset.k);
  else if(a==='plat-detail')platDetail(el.dataset.k);
  else if(a==='preview-msg'){const x=tplById($('#tTpl').value)||tpls()[0];$('#tMsg').value=x.body;$('#tMsg').focus()}
  else if(a==='templates'){closeModal();tplForm()}
  else if(a==='tpl-add')tplForm.ctl.add();
  else if(a==='tpl-del')tplForm.ctl.del(+el.dataset.i);
  else if(a==='tpl-reset')tplForm.ctl.reset();
  else if(a==='ins-ph'){const ta=lastTA&&document.contains(lastTA)?lastTA:document.querySelector('.tpl-body');if(ta){const p0=ta.selectionStart??ta.value.length,p1=ta.selectionEnd??p0;ta.value=ta.value.slice(0,p0)+el.dataset.ph+ta.value.slice(p1);ta.focus();ta.setSelectionRange(p0+el.dataset.ph.length,p0+el.dataset.ph.length)}}
  else if(a==='copy'){const tx=el.dataset.text;try{await navigator.clipboard.writeText(tx);toast('تم النسخ')}catch(_){toast('تعذّر النسخ التلقائي')}}
  else if(a==='fullscreen'){const d=$('#disp');try{await d.requestFullscreen()}catch(_){toast('ملء الشاشة غير متاح هنا')}}
  else if(a==='clear-examples'){if(el.dataset.confirm){for(const t of S.tasks.filter(t=>t.example))await del('tasks',t.id);for(const s of S.staff.filter(s=>s.example))await del('staff',s.id);toast('حُذفت بيانات الأمثلة')}else{el.dataset.confirm='1';el.textContent='تأكيد حذف الأمثلة'}}
});
document.addEventListener('input',e=>{if(e.target.id==='tSend'||e.target.id==='tDue'||e.target.id==='tStart'){const h=$('#'+e.target.id+'H');const v=fromLocalInput(e.target.value);if(h)h.textContent=v?fHl.format(new Date(v)):'';return}if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',async e=>{
  if(e.target.id==='dayPick'&&e.target.value){let v=Date.parse(e.target.value+'T00:00:00Z')-KSA;if(!isWork(v)){v=workDayOnOrBefore(v);toast('اليوم المختار عطلة، عُرض آخر يوم دوام قبله')}const lw=workDayOnOrBefore(dayStartOf(Date.now()));S.day=v>=lw?null:v;render();return}
  if(e.target.id==='termStart'&&e.target.value){S.settings.termStart=new Date(e.target.value).getTime();await saveSettings();render()}
  if(e.target.id==='logoFile'){pickLogo(e.target.files[0]);e.target.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* 3D tilt */
const fine=matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
function bindTilt(){if(!fine)return;document.querySelectorAll('.tilt').forEach(el=>{
  el.onpointermove=e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateX(${-y*7}deg) rotateY(${x*9}deg) translateZ(4px)`};
  el.onpointerleave=()=>{el.style.transform=''};})}

/* clock + due watcher (display only, no writes) */
let lastDue=-1;
function tick(){paintLive();const d=new Date();{const sc=$('#sclk');if(sc){sc.textContent=fT.format(d);}}paintClock(d);$('#clk').textContent=fT.format(d);$('#hijri').innerHTML=`${fHk.format(d)}<br><i class="gsep"> · </i>${fGk.format(d)} م`;const dc=$('#dclk');if(dc)dc.textContent=fT.format(d);
  const n=totals().due.length;if(n!==lastDue){if(lastDue>=0&&n>lastDue&&!RO()){beep();toast(`حان موعد إرسال ${n-lastDue} ${n-lastDue===1?'رسالة':'رسائل'}`)}lastDue=n;if(S.ready&&$('#modal').hidden)render()}}
let actx=null;
function beep(){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[0,.22,.44].forEach((o,i)=>{const g=actx.createGain(),os=actx.createOscillator();os.type='sine';os.frequency.value=[880,1175,1568][i];g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.2);os.connect(g).connect(actx.destination);os.start(t+o);os.stop(t+o+.22)})}catch(e){}}
function dueList(){const now=Date.now();return S.tasks.filter(t=>t.status==='pending'&&t.sendAt&&t.sendAt<=now).sort((a,b)=>a.sendAt-b.sendAt).map(t=>({t,k:'send'})).concat(remList().map(t=>({t,k:'remind'})))}
function queueForm(){
  const q=dueList();
  if(!q.length){openModal(`<div class="ph"><h3>اكتمل الإرسال</h3><button class="btn sm ghost" data-act="close">إغلاق</button></div><div class="rok"><b>أُرسلت جميع الرسائل المستحقة</b><span>ستظهر ردود الزملاء في قائمة "بانتظار الرد".</span></div>`);return}
  const t=q[0].t,kind=q[0].k,s=staffById(t.staffId)||{name:'—'};const ph=intlPhone(s.phone);
  openModal(`<div class="ph"><h3>الإرسال بالتتابع <span class="tnum muted">· متبقٍ ${q.length}</span></h3><button class="btn sm ghost" data-act="close">إيقاف</button></div>
  <div class="who" style="margin-bottom:10px">${av(s.name)}<div><b>${esc(s.name)}</b><span dir="ltr">${esc(s.phone||'لا يوجد جوال')}</span></div></div>
  <div class="eyebrow" style="margin-bottom:6px">${kind==='remind'?'🔔 تذكير · ':''}${esc(t.title)}</div>
  <pre class="msgprev">${esc(msgFor(t,kind==='remind'?'remind':undefined))}</pre>
  ${ph.length<12?'<div class="banner">رقم الجوال غير مكتمل، صحّحه من سجل الزملاء أو تخطَّ هذه الرسالة.</div>':''}
  <div class="toolbar" style="justify-content:space-between;margin-top:12px">
    <button class="btn ghost" data-act="${kind==='remind'?'q-rskip':'q-skip'}" data-id="${t.id}">${kind==='remind'?'تخطي هذا التذكير':'تأجيل 30 دقيقة'}</button>
    <a class="btn wa" style="font-size:1.05rem;padding:12px 22px" href="${waLink(t,kind==='remind'?'remind':undefined)}" target="_blank" rel="noopener" data-act="${kind==='remind'?'q-rsend':'q-send'}" data-id="${t.id}">إرسال عبر واتساب ←</a>
  </div>
  <p class="muted" style="font-size:.78rem;margin:12px 0 0">بعد الضغط يُفتح واتساب برسالة جاهزة، اضغط إرسال فيه ثم ارجع هنا لتظهر الرسالة التالية.</p>`);
}
setInterval(tick,1000);tick();
setInterval(()=>{if(S.ready&&$('#modal').hidden&&(S.view==='outbox'||S.view==='display'))render()},30000);

function setScreen(n){S.screenName=n;if(!n){S.pin='';try{localStorage.removeItem('ss-pin')}catch(e){}}if(n)goFull(true);else leaveFull();try{n?localStorage.setItem('ss-screen',n):localStorage.removeItem('ss-screen')}catch(e){}S.rotIdx=0;S.rotAt=Date.now();pushPresence();scrollTo({top:0});render();if(n)toast('هذا الجهاز الآن شاشة عرض: '+n)}
if(location.hash==='#control'||location.hash==='#admin'){S.screenName='';try{localStorage.removeItem('ss-screen')}catch(e){}}
addEventListener('hashchange',()=>{if((location.hash==='#control'||location.hash==='#admin')&&S.screenName){setScreen('')}});
if(location.hash==='#screen'&&!S.screenName){S.screenName='شاشة';try{localStorage.setItem('ss-screen','شاشة')}catch(e){}}
function readPinHash(){const m=/^#screen-(indiv|week|day|ach)$/.exec(location.hash||'');if(!m)return false;const pg=PAGES.find(x=>x[0]===m[1]);S.pin=pg[1];if(!S.screenName)S.screenName=pg[3];try{localStorage.setItem('ss-pin',S.pin);localStorage.setItem('ss-screen',S.screenName)}catch(e){}return true}
readPinHash();addEventListener('hashchange',()=>{if(readPinHash()){S.rotIdx=0;S.rotAt=Date.now();pushPresence();render();goFull(true)}});
if(location.hash==='#screen'){S.pin='';try{localStorage.removeItem('ss-pin')}catch(e){}}
function readHash(){const m=/^#reply-([A-Za-z0-9]+)$/.exec(location.hash||'');S.replyId=m?m[1]:null;S.replySent=null;S.replyFail=null}
readHash();addEventListener('hashchange',()=>{readHash();render()});
boot();
})();
</script>
